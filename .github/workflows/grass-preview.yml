name: Godot grass demo screenshot

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'DemoScenes/**'
      - 'project.godot'
      - '.github/workflows/grass-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install display and OpenGL software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 unzip wget

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

      - name: Render real screenshot from the Godot scene
        run: |
          mkdir -p Screenshots
          xvfb-run -a env CAPTURE_PREVIEW=1 LIBGL_ALWAYS_SOFTWARE=1 ./Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: grass-terrain-godot-screenshot
          path: Screenshots/grass_terrain_godot.png
          if-no-files-found: error

      - name: Save screenshot in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Screenshots/grass_terrain_godot.png
          if ! git diff --cached --quiet; then
            git commit -m "Add real Godot grass terrain preview"
            git push
          fi

# Re-render preview after grass density update.
