name: Godot vegetation gallery preview

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/Vegetation/**'
      - 'DemoScenes/Vegetation/**'
      - '.github/workflows/vegetation-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install display and OpenGL software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 unzip wget
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Import project resources
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Render the 17 real procedural vegetation models
        run: |
          mkdir -p Screenshots
          timeout 90s xvfb-run -a env CAPTURE_VEGETATION=1 LIBGL_ALWAYS_SOFTWARE=1 ./Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility res://DemoScenes/Vegetation/vegetation_gallery.tscn
      - name: Verify the real Godot capture
        run: test -s Screenshots/vegetation_gallery_godot.png
      - name: Upload real Godot preview
        uses: actions/upload-artifact@v4
        with:
          name: vegetation-gallery-godot-preview
          path: Screenshots/vegetation_gallery_godot.png
          if-no-files-found: error
